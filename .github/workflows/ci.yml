name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          # Smoke tests stay light; full inference deps (torch, diffusers) are
          # optional and not required for import + config checks.
          pip install pyyaml numpy pillow pytest
      - name: Run smoke tests
        run: pytest -q tests/
